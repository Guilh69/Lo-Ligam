<!doctype html>
<html lang="oc">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Thème posé AVANT le premier affichage (sinon les couleurs sombres
		     clignotent sur une page claire le temps que l'appli démarre).
		     Liste des pages harmonisées : COPIE de ARMONIZADAS dans
		     src/lib/stores/ambianca.svelte.js, à tenir identique. -->
		<script nonce="%sveltekit.nonce%">
			try {
				var ARMONIZADAS = ['/', '/mots', '/carta', '/istoria', '/parla', '/apren', '/apren/visio', '/amassa', '/imagina', '/ideas', '/illustracions', '/obras', '/obras/literatura', '/obras/cinema', '/obras/afichas', '/medias', '/medias/radios', '/medias/television', '/medias/premsa', '/medias/livres', '/medias/livres/pastre-1913', '/aprene', '/apren/jocs'];
				var d = document.documentElement.dataset;
				var t = localStorage.getItem('lo-ligam-tema') || 'sorne'; // sombre par défaut (Romain, 2026-10-22 ; clair le 21-10)
				var clar =
					(ARMONIZADAS.indexOf(location.pathname) < 0 && location.pathname.indexOf('/aprene/modul/') !== 0 && location.pathname.indexOf('/grops') !== 0 && location.pathname.indexOf('/wiki') !== 0 && location.pathname.indexOf('/cultura') !== 0 && location.pathname.indexOf('/constitucion') !== 0 && location.pathname.indexOf('/apren/gramatica') !== 0) ||
					t === 'clar' ||
					(t === 'sistema' && matchMedia('(prefers-color-scheme: light)').matches);
				d.tema = clar ? 'clar' : 'sorne';
				d.dalt = localStorage.getItem('lo-ligam-dalt') === 'on' ? 'on' : 'off';
			} catch (e) {}
		</script>
		<!-- Les couleurs que Romain a choisies depuis le site (outil « Colors », lib/colors,
		     2026-11-13) : le serveur écrit ici la feuille qui les pose et leur liste
		     (hooks.server.js), avant le premier affichage. Vides tant qu'il n'a rien changé.
		     La « vista » est son brouillon en cours, gardé le temps de l'onglet. -->
		<style id="colors-publicadas">%loligam.colors.css%</style>
		<script nonce="%sveltekit.nonce%">
			window.__loLigamColors = %loligam.colors.json%;
			try {
				var vista = sessionStorage.getItem('lo-ligam-colors-vista');
				if (vista) {
					window.__loLigamColorsVista = JSON.parse(vista);
					// (la feuille gardée n'est reposée que si elle a exactement la forme que le site écrit :
					// des variables et des couleurs #rrggbb, rien d'autre ; relecture de sécurité du 2026-11-13)
					var css = sessionStorage.getItem('lo-ligam-colors-vista-css');
					var forma = /^(html:root[a-z\[\]='():-]*\{--[a-zç0-9-]+:#[0-9a-f]{6}(;--[a-zç0-9-]+:#[0-9a-f]{6})*\}\n?)*$/;
					if (css !== null && forma.test(css)) document.getElementById('colors-publicadas').textContent = css;
				}
			} catch (e) {}
		</script>
		<!-- Les polices sont hébergées par nos soins (voir src/fonts.css) :
		     aucune requête vers Google. On précharge les deux voix principales
		     (Limelight pour les titres, Luciole pour le courant). -->
		<link rel="preload" href="/fonts/limelight.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
		<link
			rel="preload"
			href="/fonts/luciole-regular.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
