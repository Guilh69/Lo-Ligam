<!doctype html>
<html lang="oc">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Les polices sont hébergées par nos soins (voir src/fonts.css) :
		     plus aucune requête vers Google, donc plus aucune fuite d'adresse
		     IP des visiteurs. On précharge les fichiers latins des deux voix
		     principales (titres et courant) ; Fredoka (logo seul) et Cormorant
		     (rares citations) attendent leur premier usage. -->
		<link
			rel="preload"
			href="/fonts/syne-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="/fonts/instrument-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
