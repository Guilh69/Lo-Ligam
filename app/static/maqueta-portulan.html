<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Portulan sobre</title>
<!-- Maquette du 2026-10-10 : rail et catalogue de la carte, direction
     « atelier du cartographe », touche portulan sobre (choix de Romain ; la
     version ornée a été jugée trop kitsch). Méthode : la VRAIE carte tourne
     dans le cadre, avec toutes ses fonctions (Anullar, Netejar la carta,
     Fons, Autras lengas…) ; la maquette ne fait que poser une feuille de
     style par-dessus. Bouton « Actuel / Essai » pour comparer.
     scripts/levar-esbos.mjs la retire de la version en ligne. -->
<style>
html,body{margin:0;height:100%;background:#120906;overflow:hidden;font:13px/1.3 system-ui,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
.comparar{position:fixed;z-index:5;left:50%;bottom:2.2rem;translate:-50% 0;display:flex;gap:2px;padding:3px;border-radius:999px;
 background:rgba(18,9,6,.88);border:1px solid rgba(245,234,216,.2);box-shadow:0 4px 18px rgba(0,0,0,.4)}
.comparar button{border:0;border-radius:999px;padding:.4rem .9rem;background:none;color:rgba(245,234,216,.75);font:inherit;cursor:pointer}
.comparar button[aria-pressed=true]{background:#eeaf34;color:#1d0f0a;font-weight:700}
</style>
</head>
<body>
<iframe id="carta" src="/carta" title="La carte"></iframe>
<div class="comparar" role="group" aria-label="Comparer">
 <button type="button" data-v="actual" aria-pressed="false">Actuel</button>
 <button type="button" data-v="assag" aria-pressed="true">Essai</button>
</div>
<script>
// La pèl de l'assag : sonque d'aspècte, cap de foncion tocada
const PEL = `
/* panèls que daissan veire la carta, un pauc trebola */
.rail, .tirador {
	background: color-mix(in srgb, var(--t-fons-2) 72%, transparent) !important;
	backdrop-filter: blur(10px) saturate(1.15) !important;
	-webkit-backdrop-filter: blur(10px) saturate(1.15) !important;
}
.tirador { border-radius: 10px !important; }
/* lectura mai aisida : tèxtes mai legibles */
.cos b { font-size: .95rem !important; }
.cos small { font-size: .8rem !important; color: color-mix(in srgb, var(--t-tinta) 78%, transparent) !important; }
/* la sola tòca del portulan : una linha vermelha davant çò qu'es alucat */
.linha { position: relative; }
.linha:has(.basc[aria-checked='true'])::before {
	content: ''; position: absolute; left: -.6rem; top: 22%; bottom: 22%; width: 2px; border-radius: 1px; background: #e0533a;
	animation: tic .35s cubic-bezier(.2,.8,.2,1);
}
.rail-b[aria-expanded='true']::before {
	content: ''; position: absolute; left: 0; top: 22%; bottom: 22%; width: 2px; border-radius: 1px; background: #e0533a;
}
@keyframes tic { from { transform: scaleY(0); } }
`;
const carta = document.getElementById('carta');
let estil = null;
carta.addEventListener('load', () => {
	const d = carta.contentDocument;
	if (!d?.head) return console.warn('carte bloquée dans le cadre (frame-ancestors ?)');
	estil = d.createElement('style');
	estil.textContent = PEL;
	d.head.append(estil);
	causir(document.querySelector('[aria-pressed=true]').dataset.v);
});
function causir(v) {
	document.querySelectorAll('.comparar button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === v));
	if (estil) estil.disabled = v === 'actual';
}
document.querySelector('.comparar').addEventListener('click', (e) => e.target.dataset.v && causir(e.target.dataset.v));
</script>
</body>
</html>
