<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esbòs · las votz de l'Atlas</title>
<!-- Esbòs (2026-10-12) : trois façons de faire entendre les enquêtes de
     l'Atlas sonore sur la carte. ?v=a « Ondas », ?v=b « Lo viatge »,
     ?v=c « Un mot, cent parlars ». Local seulement (levar-esbos.mjs). -->
<style>
	@font-face { font-family: 'Limelight'; src: url('/fonts/limelight.woff2') format('woff2'); }
	@font-face { font-family: 'Luciole'; src: url('/fonts/luciole-regular.woff2') format('woff2'); }
	@font-face { font-family: 'Luciole'; font-weight: 700; src: url('/fonts/luciole-bold.woff2') format('woff2'); }
	@font-face { font-family: 'Cormorant Garamond'; font-style: italic; src: url('/fonts/cormorant-italic-latin.woff2') format('woff2'); }
	:root {
		--fons: #120906; --fons2: #1d0f0a; --tinta: #f5ead8; --tinta2: rgba(245, 234, 216, .68);
		--linha: rgba(245, 234, 216, .14); --aur: #eeaf34; --aurc: #ffd47f;
	}
	* { box-sizing: border-box; margin: 0; padding: 0; }
	html, body { height: 100%; }
	body { background: var(--fons); color: var(--tinta); font: 15px/1.45 'Luciole', system-ui, sans-serif; overflow: hidden; }
	.tela { position: relative; height: 100%; overflow: hidden;
		background: radial-gradient(120% 60% at 50% 25%, #2a140c 0%, var(--fons) 70%); }
	svg.carta { position: absolute; left: 0; top: 0; width: 100%; }
	.zona { stroke: rgba(18, 9, 6, .9); stroke-width: .6; }
	.cap { position: absolute; left: 16px; right: 16px; top: 14px; display: flex; align-items: center; gap: 10px; }
	.cap .marca { font-family: 'Limelight', serif; font-size: 17px; color: var(--aurc); }
	.cap .pastilha { margin-left: auto; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta2);
		border: 1px solid var(--linha); border-radius: 99px; padding: 4px 10px; }

	/* --- feuille du bas, commune aux trois --- */
	.fuelha { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, rgba(29, 15, 10, .92), var(--fons2) 30%);
		backdrop-filter: blur(10px); border-top: 1px solid var(--linha); border-radius: 22px 22px 0 0; padding: 10px 18px 22px;
		box-shadow: 0 -18px 40px rgba(0, 0, 0, .45); }
	.manha { width: 40px; height: 4px; border-radius: 4px; background: var(--linha); margin: 0 auto 12px; }
	h2 { font-family: 'Limelight', serif; font-weight: 400; font-size: 26px; line-height: 1.1; color: var(--aurc); }
	.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tinta2); margin-top: 4px; }
	.chip::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
	.titol { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 16px; color: var(--tinta2); }
	.boton { width: 58px; height: 58px; border-radius: 50%; border: 0; display: grid; place-items: center; flex: none;
		background: radial-gradient(circle at 35% 30%, var(--aurc), var(--aur) 70%); color: #2a1408;
		box-shadow: 0 0 0 6px rgba(238, 175, 52, .14), 0 8px 24px rgba(238, 175, 52, .35); }
	.boton svg { width: 24px; height: 24px; }
	.pichon { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--linha); background: transparent; color: var(--tinta); display: grid; place-items: center; }
	.pichon svg { width: 18px; height: 18px; }
	.progres { height: 3px; border-radius: 3px; background: var(--linha); margin-top: 12px; position: relative; }
	.progres i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--aur); }
	.progres i::after { content: ''; position: absolute; right: -5px; top: -4px; width: 11px; height: 11px; border-radius: 50%; background: var(--aurc); }
	.temps { display: flex; justify-content: space-between; font-size: 11px; color: var(--tinta2); margin-top: 5px; font-variant-numeric: tabular-nums; }
	.accions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
	.accions span { font-size: 12px; border: 1px solid var(--linha); border-radius: 99px; padding: 6px 12px; color: var(--tinta); }
	.accions span.aur { border-color: rgba(238, 175, 52, .5); color: var(--aurc); }

	/* --- A : ondas --- */
	.onda { fill: none; stroke: var(--c); stroke-width: 1.4; transform-box: fill-box; transform-origin: center; animation: onda 2.4s ease-out infinite; }
	.onda.d2 { animation-delay: .8s; } .onda.d3 { animation-delay: 1.6s; }
	@keyframes onda { from { transform: scale(1); opacity: .9; } to { transform: scale(7); opacity: 0; } }
	.eq { display: flex; align-items: center; gap: 3px; height: 34px; flex: 1; }
	.eq b { flex: 1; border-radius: 2px; background: linear-gradient(var(--aurc), var(--aur)); opacity: .9; animation: eq 1s ease-in-out infinite alternate; }
	@keyframes eq { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
	.karaoke { margin-top: 12px; font-size: 15.5px; line-height: 1.55; max-height: 150px; overflow: hidden;
		mask-image: linear-gradient(180deg, transparent, #000 12%, #000 80%, transparent); }
	.karaoke span { color: rgba(245, 234, 216, .38); transition: color .4s; }
	.karaoke span.dita { color: rgba(245, 234, 216, .62); }
	.karaoke span.ara { color: var(--tinta); background: linear-gradient(transparent 62%, rgba(238, 175, 52, .28) 62%); }

	/* --- B : lo viatge --- */
	.rota { fill: none; stroke: var(--aurc); stroke-width: 1.6; stroke-dasharray: 2 5; stroke-linecap: round; opacity: .75; }
	.rota-facha { fill: none; stroke: var(--aur); stroke-width: 2.4; stroke-linecap: round; }
	.subtitol { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 25px; line-height: 1.25; margin-top: 12px; }
	.subtitol em { font-style: italic; color: var(--aurc); }
	.passes { display: flex; gap: 6px; margin-top: 16px; }
	.passes i { flex: 1; height: 4px; border-radius: 4px; background: var(--linha); }
	.passes i.fach { background: var(--aur); } .passes i.ara { background: var(--aurc); box-shadow: 0 0 10px var(--aur); }
	.comandas { display: flex; align-items: center; justify-content: center; gap: 26px; margin-top: 16px; }
	.etapa { font-size: 12px; color: var(--tinta2); letter-spacing: .06em; text-transform: uppercase; }

	/* --- C : un mot, cent parlars --- */
	.chips { position: absolute; left: 16px; right: 16px; top: 52px; display: flex; gap: 8px; }
	.chips span { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 17px; padding: 5px 14px; border-radius: 99px; border: 1px solid var(--linha); color: var(--tinta2); }
	.chips span.ara { background: var(--aur); color: #2a1408; border-color: var(--aur); }
	.mot { font: 700 10.5px 'Luciole', sans-serif; paint-order: stroke; stroke: rgba(18, 9, 6, .92); stroke-width: 3px; stroke-linejoin: round; }
	.mot.gros { font-size: 13px; }
	.barras { margin-top: 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; font-size: 13px; }
	.barras .f { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 18px; }
	.barras .b { height: 8px; border-radius: 8px; }
	.barras .n { color: var(--tinta2); font-variant-numeric: tabular-nums; font-size: 12px; }
	.astuce { margin-top: 12px; font-size: 12px; color: var(--tinta2); display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<div class="tela" id="tela"></div>
<script>
const COLORS = { gas: '#5b7fff', lan: '#ff3f86', pro: '#ffb0dc', lem: '#ffa22e', auv: '#e8482a', viv: '#ffe27a', cro: '#eeaf34' };
const ICO = {
	play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
	pausa: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>',
	prec: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M17 6l-8 6 8 6zM7 6v12"/></svg>',
	seg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 6l8 6-8 6zM17 6v12"/></svg>',
	man: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12m0-1.5a1.5 1.5 0 0 1 3 0V12m0-.5a1.5 1.5 0 0 1 3 0V13m0-1a1.5 1.5 0 0 1 3 0v3a6 6 0 0 1-6 6h-1.2a6 6 0 0 1-4.6-2.2L5 16.5a1.6 1.6 0 0 1 2.4-2L8 15"/></svg>'
};
const v = (new URLSearchParams(location.search).get('v') || 'a').toLowerCase();
const frasas = (t) => t.split(/(?<=[.;!?])\s+/).filter(Boolean);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

// (lecture synchrone : les captures sans fenêtre se prennent au chargement)
const legir = (u) => { const x = new XMLHttpRequest(); x.open('GET', u, false); x.send(); return JSON.parse(x.responseText); };
if (new URLSearchParams(location.search).get('x') === '2') document.documentElement.style.zoom = 2;
(() => {
	const dial = legir('/data/dialectes.geojson'), enq = legir('/data/enquistas-lisn.json');
	const P = enq.ponches;
	const tela = document.getElementById('tela');
	const W = tela.clientWidth, H = tela.clientHeight;

	// projection simple, cadrée sur les dialectes (haut de l'écran)
	let x0 = 99, x1 = -99, y0 = 99, y1 = -99;
	for (const f of dial.features) JSON.stringify(f.geometry.coordinates).replace(/\[(-?[\d.]+),(-?[\d.]+)\]/g, (_, a, b) => { a = +a; b = +b; x0 = Math.min(x0, a); x1 = Math.max(x1, a); y0 = Math.min(y0, b); y1 = Math.max(y1, b); });
	const kx = Math.cos(44.3 * Math.PI / 180);
	const hautCarta = { a: H * 0.46, b: H * 0.5, c: H * 0.5 }[v];
	const top = { a: 50, b: 92, c: 96 }[v];
	const k = Math.min((W - 20) / ((x1 - x0) * kx), (hautCarta - 10) / (y1 - y0));
	const ox = (W - (x1 - x0) * kx * k) / 2;
	const pr = (lon, lat) => [ox + (lon - x0) * kx * k, top + (y1 - lat) * k];
	const cami = (g) => (g.type === 'Polygon' ? [g.coordinates] : g.coordinates).map((p) => p.map((an) => 'M' + an.map(([a, b]) => pr(a, b).map((n) => n.toFixed(1)).join(',')).join('L') + 'Z').join('')).join('');

	let svg = `<svg class="carta" viewBox="0 0 ${W} ${H}" style="height:${H}px">`;
	for (const f of dial.features) {
		const c = COLORS[f.properties.kod] || '#888';
		svg += `<path class="zona" d="${cami(f.geometry)}" fill="${c}" fill-opacity="${v === 'c' ? .13 : .22}"/>`;
	}
	const cap = (t) => `<div class="cap"><span class="marca">Lo Ligam</span><span class="pastilha">${t}</span></div>`;

	if (v === 'a') {
		// A — « Ondas » : un toc sur un point = la voix part tout de suite
		const ara = P.find((p) => p.n === 'Marseille');
		for (const p of P) {
			const [x, y] = pr(p.lon, p.lat), c = COLORS[p.d.kod];
			svg += `<circle cx="${x}" cy="${y}" r="7" fill="${c}" opacity=".16"/><circle cx="${x}" cy="${y}" r="3" fill="${c}" stroke="#120906" stroke-width="1"/>`;
		}
		const [ax, ay] = pr(ara.lon, ara.lat), ac = COLORS[ara.d.kod];
		svg += `<g style="--c:${ac}"><circle class="onda" cx="${ax}" cy="${ay}" r="5"/><circle class="onda d2" cx="${ax}" cy="${ay}" r="5"/><circle class="onda d3" cx="${ax}" cy="${ay}" r="5"/></g>
			<circle cx="${ax}" cy="${ay}" r="6" fill="${ac}" stroke="#fff8ec" stroke-width="2"/>`;
		const fr = frasas(ara.tx);
		const n = 2;
		const eq = Array.from({ length: 22 }, (_, i) => `<b style="height:${30 + ((i * 37) % 70)}%;animation-delay:${(i * 0.13) % 1}s"></b>`).join('');
		tela.innerHTML = svg + '</svg>' + cap('Enquistas vocalas') + `
			<div class="fuelha">
				<div class="manha"></div>
				<div style="display:flex;align-items:center;gap:14px">
					<div style="flex:1"><h2>Marselha</h2><span class="chip" style="--c:${ac}">provençal · 2 votz</span></div>
					<button class="boton">${ICO.pausa}</button>
				</div>
				<div style="display:flex;align-items:center;gap:12px;margin-top:12px"><div class="eq">${eq}</div></div>
				<div class="progres"><i style="width:38%"></i></div>
				<div class="temps"><span>0:18</span><span>0:48</span></div>
				<p class="karaoke">${fr.map((f, i) => `<span class="${i < n ? 'dita' : i === n ? 'ara' : ''}">${esc(f)}</span>`).join(' ')}</p>
				<div class="accions"><span class="aur">Votz seguenta : Ais →</span><span>Autra votz</span><span>Grafia de Mistral</span></div>
			</div>`;
	}

	if (v === 'b') {
		// B — « Lo viatge » : de l'ouest à l'est, une voix par dialecte
		const cent = {};
		for (const f of dial.features) cent[f.properties.kod] = f.properties.eti;
		const etapas = Object.entries(cent).map(([kod, [lo, la]]) => P.filter((p) => p.d.kod === kod).sort((a, b) => Math.hypot(a.lon - lo, a.lat - la) - Math.hypot(b.lon - lo, b.lat - la))[0]).filter(Boolean);
		const ouest = P.filter((p) => p.d.kod === 'gas').sort((a, b) => a.lon - b.lon)[0];
		const est = P.filter((p) => p.d.kod === 'viv' || p.d.kod === 'pro').sort((a, b) => b.lon - a.lon)[0];
		const r = [ouest, ...etapas, est].filter((p, i, t) => t.indexOf(p) === i).sort((a, b) => a.lon - b.lon);
		const pts = r.map((p) => pr(p.lon, p.lat));
		const i = 3;
		svg += `<path class="rota" d="M${pts.map((p) => p.join(',')).join('L')}"/><path class="rota-facha" d="M${pts.slice(0, i + 1).map((p) => p.join(',')).join('L')}"/>`;
		for (const p of P) { const [x, y] = pr(p.lon, p.lat); svg += `<circle cx="${x}" cy="${y}" r="1.6" fill="#f5ead8" opacity=".25"/>`; }
		r.forEach((p, j) => {
			const [x, y] = pts[j], c = COLORS[p.d.kod];
			if (j === i) svg += `<g style="--c:${c}"><circle class="onda" cx="${x}" cy="${y}" r="6"/><circle class="onda d2" cx="${x}" cy="${y}" r="6"/></g>`;
			svg += `<circle cx="${x}" cy="${y}" r="${j === i ? 7 : 5}" fill="${j <= i ? c : '#120906'}" stroke="${c}" stroke-width="2"/>`;
		});
		const ara = r[i], c = COLORS[ara.d.kod];
		const f = frasas(ara.tx)[1] || frasas(ara.tx)[0];
		tela.innerHTML = svg + '</svg>' + cap('Lo viatge') + `
			<div style="position:absolute;left:18px;right:18px;top:50px">
				<div style="font-family:Limelight,serif;font-size:21px;color:var(--tinta)">De ${esc(r[0].n)} a ${esc(r[r.length - 1].n)}</div>
				<div style="font-size:12px;color:var(--tinta2)">${r.length} votz, d'oèst en èst · la meteissa faula</div>
			</div>
			<div class="fuelha">
				<div class="manha"></div>
				<div class="etapa">Etapa ${i + 1} / ${r.length}</div>
				<h2 style="margin-top:4px">${esc(ara.n)}</h2><span class="chip" style="--c:${c}">${esc(ara.d.oc)}</span>
				<p class="subtitol">« ${esc(f)} »</p>
				<div class="passes">${r.map((_, j) => `<i class="${j < i ? 'fach' : j === i ? 'ara' : ''}"></i>`).join('')}</div>
				<div class="comandas"><button class="pichon">${ICO.prec}</button><button class="boton">${ICO.pausa}</button><button class="pichon">${ICO.seg}</button></div>
			</div>`;
	}

	if (v === 'c') {
		// C — « Un mot, cent parlars » : la carte écrit le mot de chaque lieu
		const re = /\b(?:e|et|i|y)\s+(?:lo|le|lou|lu|eth|ul|o|el|ou)\s+([^\s,;.]+)/i;
		const mots = P.map((p) => { const m = p.tx.slice(0, 90).match(re); return m && m[1].length > 2 ? { p, m: m[1].toLowerCase() } : null; }).filter(Boolean);
		const comptes = {};
		for (const { m, p } of mots) (comptes[m] ??= { n: 0, kod: {} }), comptes[m].n++, (comptes[m].kod[p.d.kod] = (comptes[m].kod[p.d.kod] || 0) + 1);
		const placats = [];
		const libre = (b) => !placats.some((a) => b.x < a.x + a.w && b.x + b.w > a.x && b.y < a.y + a.h && b.y + b.h > a.y);
		for (const { p } of mots) { const [x, y] = pr(p.lon, p.lat); svg += `<circle cx="${x}" cy="${y}" r="1.8" fill="${COLORS[p.d.kod]}"/>`; }
		for (const { p, m } of mots.sort((a, b) => comptes[a.m].n - comptes[b.m].n)) {
			const [x, y] = pr(p.lon, p.lat), w = m.length * 6.4 + 4, b = { x: x - w / 2, y: y - 15, w, h: 12 };
			if (!libre(b)) continue;
			placats.push(b);
			svg += `<text class="mot${comptes[m].n < 6 ? ' gros' : ''}" x="${x}" y="${y - 5}" text-anchor="middle" fill="${COLORS[p.d.kod]}">${esc(m)}</text>`;
		}
		const top5 = Object.entries(comptes).sort((a, b) => b[1].n - a[1].n).slice(0, 5);
		const max = top5[0][1].n;
		tela.innerHTML = svg + '</svg>' + cap('Un mot, cent parlars') + `
			<div class="chips"><span class="ara">lo solelh</span><span>la bisa</span><span>lo viatjaire</span></div>
			<div class="fuelha">
				<div class="manha"></div>
				<div style="display:flex;align-items:baseline;gap:10px"><h2>«&nbsp;solelh&nbsp;»</h2><span class="titol">dins ${mots.length} parlars</span></div>
				<div class="barras">${top5.map(([m, o]) => { const kod = Object.entries(o.kod).sort((a, b) => b[1] - a[1])[0][0]; return `<span class="f" style="color:${COLORS[kod]}">${esc(m)}</span><span class="b" style="width:${(o.n / max) * 100}%;background:${COLORS[kod]}"></span><span class="n">${o.n}</span>`; }).join('')}</div>
				<p class="astuce">${ICO.man.replace('<svg', '<svg width="16" height="16"')} Tocatz un mot per l'ausir dins la boca del parlar</p>
			</div>`;
	}
})();
</script>
</body>
</html>
