<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>OPLO 2020, fonds et couleurs</title>
<!-- Planche de choix (2026-10-24) : 1) les couleurs par famille proposées le
     2026-10-12 (gabarits de design-stock/vecteurs/gabarits/, jamais validées) ;
     2) la scène carte dans la DA Instagram de Romain (fond plein, titre en
     capitales, traduction en italique avec le drapeau, aplats francs sans
     contour, flèches dessinées du kit) sur plusieurs fonds et couleurs de mise
     en lumière. -->
<style>
	@font-face { font-family: Limelight; src: url(../../../app/static/fonts/limelight.woff2) format('woff2'); }
	@font-face { font-family: Luciole; src: url(../../../app/static/fonts/luciole-regular.woff2) format('woff2'); }
	@font-face { font-family: Luciole; font-weight: 700; src: url(../../../app/static/fonts/luciole-bold.woff2) format('woff2'); }
	@font-face { font-family: Luciole; font-style: italic; src: url(../../../app/static/fonts/luciole-italic.woff2) format('woff2'); }
	body { margin: 0; background: #141010; color: #f5ead8; font-family: Luciole, sans-serif; padding: 16px; }
	h2 { font: 700 20px Luciole; margin: 6px 0 10px; }
	h2 small { font-weight: 400; color: #b8a890; }
	.familhas, .variantas { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
	figure { margin: 0; }
	figcaption { font: 700 16px Luciole; margin: 0 0 6px; }
	figcaption span { font-weight: 400; color: #b8a890; }
	.familhas img { width: 175px; display: block; border-radius: 4px; }
	.variantas svg { width: 540px; height: 675px; display: block; }
</style>
</head>
<body>
<h2>Couleurs par famille <small>(proposées le 12 octobre, jamais validées)</small></h2>
<div class="familhas">
	<figure><figcaption>1 Vocabulaire <span>· brique</span></figcaption><img src="../../vecteurs/gabarits/1-vocabulaire.png" alt=""></figure>
	<figure><figcaption>2 Grammaire et langue <span>· pétrole</span></figcaption><img src="../../vecteurs/gabarits/2-grammaire.png" alt=""></figure>
	<figure><figcaption>3 Culture et calendrier <span>· or, texte brun</span></figcaption><img src="../../vecteurs/gabarits/3-culture.png" alt=""></figure>
	<figure><figcaption>4 Sensibilisation <span>· brun</span></figcaption><img src="../../vecteurs/gabarits/4-sensibilisation.png" alt=""></figure>
	<figure><figcaption>5 Vidéo <span>· brique, 9:16</span></figcaption><img src="../../vecteurs/gabarits/5-video.png" alt=""></figure>
	<figure><figcaption>6 Annonces <span>· crème</span></figcaption><img src="../../vecteurs/gabarits/6-annonces.png" alt=""></figure>
</div>
<h2>La carte selon le fond et la couleur de mise en lumière</h2>
<div class="variantas" id="variantas"></div>
<script src="carta-donadas.js"></script>
<script>
	// num : couleur des chiffres ; pastilha : chiffres sur une pastille de cette couleur
	const CAUDAS = ['#F5EAD8', '#FFD47F', '#EEAF34', '#D4702A', '#B53D17'];
	const VARS = [
		{ nom: 'B · pétrole, mise en lumière jaune', fons: '#1F5F63', gama: CAUDAS, res: 'rgba(255,255,255,0.12)', tinta: '#fff', num: '#FFD47F' },
		{ nom: 'B2 · pétrole, mise en lumière rouge', fons: '#1F5F63', gama: CAUDAS, res: 'rgba(255,255,255,0.12)', tinta: '#fff', pastilha: '#B53D17' },
		{ nom: 'C · jaune, mise en lumière rouge', fons: '#FFD47F', gama: ['#FFF6E6', '#F2B48A', '#D9774E', '#B53D17', '#6E1E10'], res: 'rgba(58,42,32,0.10)', tinta: '#3A2A20', num: '#B53D17' },
		{ nom: 'D · brun, mise en lumière jaune', fons: '#3A2A20', gama: CAUDAS, res: 'rgba(255,255,255,0.10)', tinta: '#fff', num: '#FFD47F' }
	];
	const CLASSAS = [0, 5, 10, 15, 20];
	const classa = (p) => CLASSAS.findLastIndex((m) => p >= m);

	// la flèche à boucle du kit (corps), en coordonnées locales
	const P = [[10, 40], [120, 60], [80, 55], [225, 110]];
	const OUT = [[50, -40], [-15, 45], [20, -35]];
	const IN = [[20, -60], [-20, 35], [-45, -80]];
	let corsD = `M${P[0]}`;
	for (let i = 0; i < 3; i++)
		corsD += ` C${P[i][0] + OUT[i][0]},${P[i][1] + OUT[i][1]} ${P[i + 1][0] + IN[i][0]},${P[i + 1][1] + IN[i][1]} ${P[i + 1]}`;
	// une flèche dessinée de L (près du nom) vers T (le département)
	function fleca(L, T, color) {
		const [sx, sy] = P[0], [ex, ey] = P[3];
		const s = Math.hypot(T[0] - L[0], T[1] - L[1]) / Math.hypot(ex - sx, ey - sy);
		const th = Math.atan2(T[1] - L[1], T[0] - L[0]) - Math.atan2(ey - sy, ex - sx);
		const tr = `translate(${L}) rotate(${(th * 180) / Math.PI}) scale(${s}) translate(${-sx},${-sy})`;
		const dir = th + Math.atan2(80, 45);
		const pt = (a) => `${T[0] - 26 * Math.cos(dir + a)},${T[1] - 26 * Math.sin(dir + a)}`;
		return `<path d="${corsD}" transform="${tr}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
			<path d="M${pt(0.5)} L${T} L${pt(-0.5)}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
	}
	// le drapeau rond (devant la traduction)
	const drapèu = (x, y, k) => `<clipPath id="r${k}"><circle cx="${x}" cy="${y}" r="16"/></clipPath>
		<g clip-path="url(#r${k})"><rect x="${x - 16}" y="${y - 16}" width="11" height="32" fill="#2b3f8f"/><rect x="${x - 5}" y="${y - 16}" width="10" height="32" fill="#fff"/><rect x="${x + 5}" y="${y - 16}" width="11" height="32" fill="#d8312b"/></g>`;

	const dep = (c) => CARTA.deps.find((d) => d.code === c);
	VARS.forEach((v, k) => {
		let s = `<rect width="1080" height="1350" fill="${v.fons}"/>`;
		// titre : capitales centrées, comme « SABETZ COSSÍ… »
		s += `<text x="540" y="150" text-anchor="middle" font-family="Luciole" font-weight="700" font-size="70" fill="${v.tinta}">QUAL PARLA OCCITAN</text>`;
		s += `<text x="540" y="235" text-anchor="middle" font-family="Luciole" font-weight="700" font-size="70" fill="${v.tinta}">UÈI ?</text>`;
		s += `<clipPath id="dom${k}"><path d="${CARTA.domeni}" clip-rule="evenodd"/></clipPath>`;
		s += `<path d="${CARTA.domeni}" fill="${v.res}" fill-rule="evenodd"/>`;
		s += `<g clip-path="url(#dom${k})">`;
		for (const d of CARTA.deps) {
			const c = v.gama[classa(d.pct)];
			s += `<path d="${d.d}" fill="${c}" stroke="${c}" stroke-width="1.2"/>`;
		}
		s += `</g>`;
		// trois noms, flèches dessinées
		for (const [code, nom, x, y, L] of [
			['33', 'Gironda', 70, 330, [150, 400]],
			['48', 'Losèra', 760, 380, [760, 450]],
			['ARAN', 'Val d’Aran', 420, 990, [430, 960]]
		]) {
			const d = dep(code);
			if (v.pastilha) {
				s += `<rect x="${x - 12}" y="${y - 50}" width="${d.pct < 10 ? 112 : 142}" height="62" rx="31" fill="${v.pastilha}"/>`;
				s += `<text x="${x + 6}" y="${y}" font-family="Limelight" font-size="50" fill="#fff">${d.pct} %</text>`;
			} else s += `<text x="${x}" y="${y}" font-family="Limelight" font-size="54" fill="${v.num}">${d.pct} %</text>`;
			s += `<text x="${x}" y="${y + 40}" font-family="Luciole" font-weight="700" font-size="30" fill="${v.tinta}">${nom}</text>`;
			s += fleca(L, d.c, v.tinta);
		}
		// traduction, en italique avec le drapeau
		s += drapèu(300, 1130, k);
		s += `<text x="330" y="1140" font-family="Luciole" font-style="italic" font-size="32" fill="${v.tinta}">Qui parle occitan aujourd’hui ?</text>`;
		s += `<g>${CARTA.gabarit.logo}</g>`;
		const f = document.createElement('figure');
		f.innerHTML = `<figcaption>${v.nom}</figcaption><svg viewBox="0 0 1080 1350">${s}</svg>`;
		document.getElementById('variantas').append(f);
	});
</script>
</body>
</html>
