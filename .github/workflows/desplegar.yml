# Construit l'image du site et l'envoie au registre Scaleway.
#
# Romain n'a pas Docker sur son ordinateur : c'est GitHub qui construit,
# gratuitement, à chaque envoi sur master. Le conteneur Scaleway va ensuite
# chercher cette image.
#
# Secret à renseigner dans GitHub (Settings → Secrets and variables →
# Actions) : SCW_SECRET_KEY, la clé secrète d'une clé d'API Scaleway.

name: Bastir e desplegar

on:
  push:
    branches: [master]
    # Inutile de reconstruire pour une modification de documentation.
    paths-ignore:
      - '**.md'
      - 'design-stock/**'
  # Permet aussi de lancer la construction à la main depuis l'onglet Actions.
  workflow_dispatch:

env:
  REGISTRE: rg.fr-par.scw.cloud/lo-ligam
  IMATGE: lo-ligam

jobs:
  bastir:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperar lo còdi
        uses: actions/checkout@v4

      - name: Preparar Docker
        uses: docker/setup-buildx-action@v3

      - name: Se connectar al registre Scaleway
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          # Scaleway attend littéralement « nologin » comme identifiant ;
          # seule la clé secrète authentifie.
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Bastir e mandar l'imatge
        uses: docker/build-push-action@v6
        with:
          # Le Dockerfile est dans app/, pas à la racine du dépôt.
          context: ./app
          push: true
          tags: |
            ${{ env.REGISTRE }}/${{ env.IMATGE }}:latest
            ${{ env.REGISTRE }}/${{ env.IMATGE }}:${{ github.sha }}
          # Réutilise les couches d'une construction à l'autre : les
          # dépendances ne sont réinstallées que si package.json change.
          cache-from: type=gha
          cache-to: type=gha,mode=max
