# Construit l'image du site et l'envoie au registre Scaleway.
#
# Romain n'a pas Docker sur son ordinateur : c'est GitHub qui construit,
# gratuitement, à chaque envoi sur master. Le conteneur Scaleway va ensuite
# chercher cette image.
#
# Secret à renseigner dans GitHub (Settings → Secrets and variables →
# Actions) : SCW_SECRET_KEY, la clé secrète d'une clé d'API Scaleway.

name: Bastir e desplegar

on:
  push:
    branches: [master]
    # Sonque çò que va dins l'imatge (app/) e aqueste fichièr : la
    # documentacion, SIG/, design-stock/ o Modules_cors/ tòcan pas lo site.
    paths:
      - 'app/**'
      - '!app/**.md'
      - '.github/workflows/desplegar.yml'
  # Permet aussi de lancer la construction à la main depuis l'onglet Actions.
  workflow_dispatch:

# Lo jeton de GitHub a pas besonh que de legir lo depaus : l'imatge
# es mandada amb la clau Scaleway.
permissions:
  contents: read

# Un sol desplegament a la vegada : un mandadís novèl arrèsta los que son
# en cors. Se que non, quand se'n relança mantun a la vegada, lo darrièr
# acabat demòra en linha, e pòt èsser lo pus vièlh (2026-10-10).
concurrency:
  group: desplegar
  cancel-in-progress: true

env:
  REGISTRE: rg.fr-par.scw.cloud/lo-ligam
  IMATGE: lo-ligam
  # Nom del conteneire Serverless (namespace « ligam-web »). Se lo nom
  # cambia dins la consòla, cal lo cambiar aicí tanben.
  CONTENEIRE: lo-ligam
  # Adreça del site dempuèi lo 2026-10-15 (l'adreça tecnica …scw.cloud i renvia).
  SITE: https://loligam.eu

jobs:
  bastir:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperar lo còdi
        uses: actions/checkout@v4

      - name: Preparar Docker
        uses: docker/setup-buildx-action@v3

      - name: Se connectar al registre Scaleway
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          # Scaleway attend littéralement « nologin » comme identifiant ;
          # seule la clé secrète authentifie.
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Bastir e mandar l'imatge
        uses: docker/build-push-action@v6
        with:
          # Le Dockerfile est dans app/, pas à la racine du dépôt.
          context: ./app
          push: true
          tags: |
            ${{ env.REGISTRE }}/${{ env.IMATGE }}:latest
            ${{ env.REGISTRE }}/${{ env.IMATGE }}:${{ github.sha }}
          # Réutilise les couches d'une construction à l'autre : les
          # dépendances ne sont réinstallées que si package.json change.
          # 2026-11-01 : le cache GitHub (type=gha) faisait échouer la construction
          # avec « DeadlineExceeded: context deadline exceeded » (déploiements
          # n° 495 à 497). Désactivé : la construction repart de zéro à chaque
          # envoi, un peu plus longue mais sûre.
          # cache-from: type=gha
          # cache-to: type=gha,mode=max

      # Mandar l'imatge basta pas : lo conteneire garda la version qu'a ja
      # cargada. Cal li demandar de tornar quèrre l'imatge « latest ».
      # L'API de Scaleway s'autentifica amb la sola clau secreta, doncas cap
      # de segond secret d'apondre — mas la politica IAM deu autorizar
      # ContainersFullAccess en mai de ContainerRegistryFullAccess.
      - name: Tornar desplegar lo conteneire
        id: desplegar
        # Facultatiu : tant que la politica IAM autoriza pas
        # ContainersFullAccess, aquesta etapa fracassa sens far tombar la
        # construccion. Lo mai important — bastir e mandar l'imatge — es ja
        # fach. Dins aqueste cas, clicar « Redéployer » dins la consòla.
        continue-on-error: true
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          set -euo pipefail
          API="https://api.scaleway.com/containers/v1beta1/regions/fr-par"

          ID=$(curl -sS -H "X-Auth-Token: $SCW_SECRET_KEY" \
            "$API/containers?name=$CONTENEIRE" \
            | jq -r --arg n "$CONTENEIRE" \
                '.containers // [] | map(select(.name == $n)) | .[0].id // empty')

          if [ -z "$ID" ]; then
            echo "::error::Cap de conteneire nomenat « $CONTENEIRE » trobat en fr-par."
            echo "::error::Verificar lo nom del conteneire e que la clau a ben lo drech ContainersFullAccess."
            exit 1
          fi

          echo "Conteneire trobat : $ID"
          curl -sS -X POST -H "X-Auth-Token: $SCW_SECRET_KEY" \
            "$API/containers/$ID/deploy" > /dev/null
          echo "Desplegament demandat. Scaleway carga l'imatge novèla."
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      # Un desplegament demandat es pas un desplegament capitat. Aicí
      # s'espèra que Scaleway anóncia « ready », puèi se verifica que lo
      # site respond vertadièrament. Sens aquò, una imatge copada passariá
      # en verd sens que degun o veja.
      - name: Verificar que lo site respond
        if: steps.desplegar.outcome == 'success'
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          ID: ${{ steps.desplegar.outputs.id }}
        run: |
          set -euo pipefail
          API="https://api.scaleway.com/containers/v1beta1/regions/fr-par"

          for i in $(seq 1 40); do
            ESTAT=$(curl -sS -H "X-Auth-Token: $SCW_SECRET_KEY" \
              "$API/containers/$ID" | jq -r '.status')
            echo "  ($i/40) estat : $ESTAT"
            case "$ESTAT" in
              ready) break ;;
              error) echo "::error::Scaleway anóncia una error de desplegament."; exit 1 ;;
            esac
            sleep 10
          done

          if [ "$ESTAT" != "ready" ]; then
            echo "::error::Lo conteneire es pas passat « ready » en 400 segondas."
            exit 1
          fi

          CODI=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$SITE/")
          echo "Lo site respond : HTTP $CODI"
          [ "$CODI" = "200" ] || { echo "::error::Lo site respond pas 200."; exit 1; }
